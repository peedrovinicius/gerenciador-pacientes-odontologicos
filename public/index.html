<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema web para cadastro, consulta, edição e exclusão de registros odontológicos.">
    <title>Gerenciador de Pacientes Odontológicos</title>
    <style>
        :root {
            font-family: Arial, sans-serif;
            color: #243447;
            background: #f4f6f8;
        }

        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; }
        main { width: min(760px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0; }
        .cabecalho { margin-bottom: 24px; }
        h1 { margin-bottom: 8px; }
        .subtitulo { margin-top: 0; color: #5d6d7e; }
        .cartao { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08); margin-bottom: 20px; }
        form { display: grid; gap: 16px; }
        label { font-weight: 700; }
        input { width: 100%; margin-top: 6px; padding: 12px; border: 1px solid #cbd5df; border-radius: 8px; font: inherit; }
        input:focus { outline: 2px solid #7da0c1; outline-offset: 1px; }
        .acoes-formulario { display: flex; gap: 10px; flex-wrap: wrap; }
        button { padding: 10px 14px; border: 0; border-radius: 8px; background: #243447; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
        button:disabled { opacity: 0.7; cursor: wait; }
        .botao-cancelar { background: #6b7785; }
        .botao-excluir { background: #8b2c2c; margin-top: 10px; }
        .botao-editar { margin-top: 10px; margin-right: 8px; }
        #mensagem { min-height: 24px; margin: 0; }
        .lista { display: grid; gap: 12px; padding: 0; margin: 0; list-style: none; }
        .paciente { border: 1px solid #e1e7ed; border-radius: 10px; padding: 16px; }
        .paciente h3 { margin: 0 0 6px; }
        .paciente p { margin: 4px 0; }
        .vazio { color: #6b7785; }
    </style>
</head>
<body>
    <main>
        <header class="cabecalho">
            <h1>Gerenciador de Pacientes Odontológicos</h1>
            <p class="subtitulo">Cadastro, consulta, edição e exclusão de procedimentos registrados.</p>
        </header>

        <section class="cartao" aria-labelledby="titulo-formulario">
            <h2 id="titulo-formulario">Novo registro</h2>
            <form id="formulario-paciente">
                <div>
                    <label for="nome">Nome do paciente</label>
                    <input id="nome" name="nome" type="text" maxlength="120" required>
                </div>
                <div>
                    <label for="procedimento">Procedimento realizado</label>
                    <input id="procedimento" name="procedimento" type="text" maxlength="200" required>
                </div>
                <div class="acoes-formulario">
                    <button id="botao-salvar" type="submit">Salvar registro</button>
                    <button id="botao-cancelar" class="botao-cancelar" type="button" hidden>Cancelar edição</button>
                </div>
                <p id="mensagem" role="status" aria-live="polite"></p>
            </form>
        </section>

        <section class="cartao" aria-labelledby="titulo-registros">
            <h2 id="titulo-registros">Registros</h2>
            <ul id="lista" class="lista"></ul>
        </section>
    </main>

    <script>
        const formulario = document.getElementById('formulario-paciente');
        const lista = document.getElementById('lista');
        const mensagem = document.getElementById('mensagem');
        const botaoSalvar = document.getElementById('botao-salvar');
        const botaoCancelar = document.getElementById('botao-cancelar');
        const campoNome = document.getElementById('nome');
        const campoProcedimento = document.getElementById('procedimento');

        let pacienteEmEdicao = null;

        function criarRegistro(paciente) {
            const item = document.createElement('li');
            item.className = 'paciente';

            const nome = document.createElement('h3');
            nome.textContent = paciente.nome;

            const procedimento = document.createElement('p');
            procedimento.textContent = `Procedimento: ${paciente.procedimento}`;

            const botaoEditar = document.createElement('button');
            botaoEditar.type = 'button';
            botaoEditar.className = 'botao-editar';
            botaoEditar.textContent = 'Editar';
            botaoEditar.addEventListener('click', () => iniciarEdicao(paciente));

            const botaoExcluir = document.createElement('button');
            botaoExcluir.type = 'button';
            botaoExcluir.className = 'botao-excluir';
            botaoExcluir.textContent = 'Excluir';
            botaoExcluir.addEventListener('click', () => excluirPaciente(paciente.id, botaoExcluir));

            item.append(nome, procedimento, botaoEditar, botaoExcluir);
            return item;
        }

        function renderizarPacientes(pacientes) {
            lista.replaceChildren();

            if (pacientes.length === 0) {
                const vazio = document.createElement('li');
                vazio.className = 'vazio';
                vazio.textContent = 'Nenhum registro cadastrado.';
                lista.appendChild(vazio);
                return;
            }

            pacientes.forEach((paciente) => lista.appendChild(criarRegistro(paciente)));
        }

        function iniciarEdicao(paciente) {
            pacienteEmEdicao = paciente.id;
            campoNome.value = paciente.nome;
            campoProcedimento.value = paciente.procedimento;
            botaoSalvar.textContent = 'Salvar alterações';
            botaoCancelar.hidden = false;
            mensagem.textContent = 'Editando registro.';
            campoNome.focus();
        }

        function cancelarEdicao() {
            pacienteEmEdicao = null;
            formulario.reset();
            botaoSalvar.textContent = 'Salvar registro';
            botaoCancelar.hidden = true;
            mensagem.textContent = '';
        }

        async function carregarPacientes() {
            try {
                const resposta = await fetch('/api/pacientes');
                if (!resposta.ok) throw new Error('Não foi possível carregar os registros.');

                const pacientes = await resposta.json();
                renderizarPacientes(pacientes);
            } catch (erro) {
                mensagem.textContent = erro.message;
            }
        }

        async function excluirPaciente(id, botao) {
            if (!window.confirm('Excluir este registro?')) return;

            botao.disabled = true;
            mensagem.textContent = '';

            try {
                const resposta = await fetch(`/api/pacientes/${encodeURIComponent(id)}`, {
                    method: 'DELETE',
                });

                if (!resposta.ok) {
                    const resultado = await resposta.json();
                    throw new Error(resultado.erro || 'Não foi possível excluir o registro.');
                }

                if (pacienteEmEdicao === id) cancelarEdicao();
                mensagem.textContent = 'Registro excluído com sucesso.';
                await carregarPacientes();
            } catch (erro) {
                mensagem.textContent = erro.message;
                botao.disabled = false;
            }
        }

        formulario.addEventListener('submit', async (evento) => {
            evento.preventDefault();
            mensagem.textContent = '';
            botaoSalvar.disabled = true;

            const dados = Object.fromEntries(new FormData(formulario));
            const editando = pacienteEmEdicao !== null;
            const url = editando
                ? `/api/pacientes/${encodeURIComponent(pacienteEmEdicao)}`
                : '/api/pacientes';
            const method = editando ? 'PUT' : 'POST';

            try {
                const resposta = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados),
                });

                const resultado = await resposta.json();
                if (!resposta.ok) throw new Error(resultado.erro || 'Não foi possível salvar o registro.');

                formulario.reset();
                pacienteEmEdicao = null;
                botaoSalvar.textContent = 'Salvar registro';
                botaoCancelar.hidden = true;
                mensagem.textContent = editando
                    ? 'Registro atualizado com sucesso.'
                    : 'Registro salvo com sucesso.';
                await carregarPacientes();
            } catch (erro) {
                mensagem.textContent = erro.message;
            } finally {
                botaoSalvar.disabled = false;
            }
        });

        botaoCancelar.addEventListener('click', cancelarEdicao);
        carregarPacientes();
    </script>
</body>
</html>
