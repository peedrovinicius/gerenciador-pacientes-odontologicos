name: Limpar branches antigas

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-branches.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remover branches já mescladas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE repos/${GITHUB_REPOSITORY}/git/refs/heads/docs/contribution-workflow
          gh api -X DELETE repos/${GITHUB_REPOSITORY}/git/refs/heads/fix/require-json-content-type
