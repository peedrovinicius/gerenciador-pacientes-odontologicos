name: Publicar release v1.1.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v1.1.0.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Publicar v1.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.0 >/dev/null 2>&1; then
            echo "Release v1.1.0 já existe."
            exit 0
          fi

          cat > /tmp/release-notes.md <<'EOF'
          Versão estável da demonstração odontológica.

          Principais melhorias:
          - odontograma FDI interativo com 32 dentes;
          - base fixa de pacientes fictícios e alterações temporárias;
          - API REST Node.js/Express com contrato padronizado de erros;
          - CSP, Permissions-Policy e demais cabeçalhos de segurança;
          - limite de payload e de registros da demonstração;
          - ESLint, 27 testes automatizados e npm audit sem vulnerabilidades;
          - Lighthouse 100/100 em visão geral, pacientes, odontograma e tema escuro;
          - deploy do GitHub Pages condicionado ao CI verde;
          - README com arquitetura, screenshots e demonstração animada.
          EOF

          gh release create v1.1.0 \
            --target main \
            --title "Versão 1.1.0" \
            --notes-file /tmp/release-notes.md
